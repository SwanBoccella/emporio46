[build]
  command = "npm run build"
  publish = "dist"
  # Risparmio crediti: nessun nuovo deploy se cambiano solo documentazione, test o template email
  # (exit 0 = salta la build; se git non riesce a confrontare, la build parte normalmente)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)LICENSE' ':(exclude)tests' ':(exclude)emailjs-templates' ':(exclude).env.example'"

[build.environment]
  NODE_VERSION = "20"
  # Valori pubblici per progettazione (finiscono nel sito): non devono far fallire lo scanner di segreti
  SECRETS_SCAN_OMIT_KEYS = "VITE_GIST_ID,VITE_EMAILJS_SERVICE,VITE_EMAILJS_PUBLIC_KEY,VITE_EMAILJS_TEMPLATE,VITE_EMAILJS_TEMPLATE_CLIENT"

[functions]
  directory = "netlify/functions"

# Redirect SPA e cache degli asset: public/_redirects e public/_headers
