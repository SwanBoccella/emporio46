[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Valori pubblici per progettazione (finiscono nel sito): non devono far fallire lo scanner di segreti
  SECRETS_SCAN_OMIT_KEYS = "VITE_GIST_ID,VITE_EMAILJS_SERVICE,VITE_EMAILJS_PUBLIC_KEY,VITE_EMAILJS_TEMPLATE,VITE_EMAILJS_TEMPLATE_CLIENT"

[functions]
  directory = "netlify/functions"

# Redirect SPA e cache degli asset: public/_redirects e public/_headers
